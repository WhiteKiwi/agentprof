name: Publish verified exploration source
on:
  push:
    branches: [feat/exploration-diagnostic]
    paths: [.github/workflows/exploration-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/feat/exploration-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
      - name: Verify patch allowlist and exact resulting blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/exploration-diagnostic
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          expected = {
            'src/analysis/source-exploration.ts': '02d5ceee11099005e1b726da4a68cb6f0a63799f',
            'src/cli/exploration.ts': '2fc78d4ebf0b849e661cef889dff93531060040a',
            'src/cli/insights.ts': 'f8291575aecbc29a632694393c3953bcb2cc4652',
            'src/cli/main.ts': '81bf1a361425f1cd08a88c9dadaec156499c9bb0',
            'tests/cli-exploration.test.ts': '9343833c66cf94274955906af6886e3ca4386367',
            'tests/cli-invocation-overlap.test.ts': 'dd2032a57bdbe6b9cf62de43cbc0d3102caac866',
            'tests/cli-read-revisits.test.ts': '7c76404f41b7e34f2eac121cc2a59b5500c64a05',
            'tests/cli-search-recurrence.test.ts': 'c9d37cf6d0e1e8959c14b2a4dfcf6fd13e001bb2',
            'tests/exploration-fixture.ts': '9c7ef8b34b5a6a52428449d25354978d0f6f1b15',
            'tests/source-exploration-format.test.ts': '27067b39edd870400424547c1ee695e72005ca17',
            'tests/source-exploration-integration.test.ts': '8a31b488d897cd362f8cf46129b00628abdb94b0',
            'tests/source-exploration.test.ts': '91d1fc230bff6d3c4e384382f669ae6681423cea'
          }
          fragments = [f'.github/exploration-part{i}.txt' for i in range(1,4)]
          encoded = ''.join(pathlib.Path(p).read_text().strip() for p in fragments)
          assert len(encoded) == 21676, 'Unexpected encoded size'
          patch = gzip.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch) == 59439, 'Unexpected patch size'
          assert hashlib.sha256(patch).hexdigest() == '8ed56ea0e62453c06702de7f7617bc5d3338f7584c8c37dfa45346192e0a8444', 'Patch digest mismatch'
          patch.decode('utf-8')
          stats = subprocess.check_output(['git','apply','--numstat','-'],input=patch).decode().splitlines()
          assert {line.split('\t')[2] for line in stats} == set(expected), 'Unexpected patch path'
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          for path,digest in expected.items():
            assert subprocess.check_output(['git','hash-object',path]).decode().strip() == digest, path
            assert subprocess.check_output(['git','ls-files','-s','--',path]).decode().startswith('100644 ' + digest), path
          staging = fragments + ['.github/workflows/exploration-publish.yml']
          subprocess.run(['git','rm','--',*staging],check=True)
          changed = subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert set(changed) == set(expected) | set(staging), 'Unexpected staged path'
          assert not subprocess.check_output(['git','diff','--name-only']).strip(), 'Unstaged differences'
          print('Verified all 12 implementation blobs; removed 4 temporary staging files.')
          PY
          git diff --cached --check
          git config user.name 'AgentProf development'
          git config user.email 'agentprof-dev@users.noreply.github.com'
          git commit -m 'feat: add evidence-gated exploration diagnostic'
          git push origin HEAD:refs/heads/feat/exploration-diagnostic
          git log -1 --format='%H %T'
