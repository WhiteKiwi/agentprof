name: Publish qualified directory CLI source
on:
  push:
    branches: [feat/directory-scan-cli]
    paths: [.github/workflows/directory-cli-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/feat/directory-scan-cli'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/directory-scan-cli
          fetch-depth: 0
      - name: Validate inert staged patch and exact dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/directory-scan-cli
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse afdc9fbd129c352f55e3f8f32e28d9e8ecaf453d^{tree})" = 26e9e8db16b847ddfb7a776c72a33f8eef9dec7e
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          expected = ['a275dc8c3eb5085f17badec23e6ce9057d1df3f1', '60722080ef6cd03e5c7575e3768d2526127679b4', 'a97709e76e676abaaf57abea87b60d483bece189', 'f9aa162dcc554b16f94356264edcfdd07c77e0a7']
          chunks = []
          for index, sha in enumerate(expected):
              data = pathlib.Path(f'.github/directory-cli-{index}.b64').read_bytes()
              if index == 0 and blob(data) == 'e50362ef62dfd5d1309d1338deda472347b67edf':
                  # Repair only the independently identified staging transcription;
                  # the normalized original blob, full delta and final tree still must match.
                  assert data.count(b'f3GlrRRwAe') == 1
                  data = data.replace(b'f3GlrRRwAe', b'f3OrRRwAe')
              assert blob(data) == sha, f'Original chunk mismatch: {index}'
              chunks.append(data)
          patch = gzip.decompress(base64.b64decode(b''.join(chunks), validate=True))
          assert len(patch) == 52862
          assert hashlib.sha256(patch).hexdigest() == '5f15ccf35df8e53121fee039db729bfd814d5a0acdcfbf434a059355deb597a7'
          patch.decode('utf-8', errors='strict')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'directory-cli.patch'
          target.write_bytes(patch)
          names = [line.split('\t')[2] for line in subprocess.check_output(['git','apply','--numstat',str(target)], text=True).splitlines()]
          assert sorted(names) == sorted(['docs/P4-DIRECTORY-CLI-VERIFY.md','src/cli/directory-scan.ts','src/cli/main.ts','tests/directory-scan-cli.test.ts','tests/directory-scan.test.ts'])
          PY
      - name: Compose and publish only the exact qualified feature tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit afdc9fbd129c352f55e3f8f32e28d9e8ecaf453d
          git apply --index "$RUNNER_TEMP/directory-cli.patch"
          python3 - <<'PY'
          import subprocess
          expected = {
              'docs/P4-DIRECTORY-CLI-VERIFY.md':'5f71af28257f6e7ac273bf9be64b1a249ded01a9',
              'src/cli/directory-scan.ts':'5e62803100d5497021c67aa9f8d61d07ec1dd144',
              'src/cli/main.ts':'d636e88300706f819603cdceb45b05432b9f58c6',
              'tests/directory-scan-cli.test.ts':'0aedbac616eb6cde1e6f2c7f84253725b06913de',
              'tests/directory-scan.test.ts':'82f765c7fe080fd56fe892838953d3ac58ec7b27',
              'docs/P4-DIRECTORY-CLI.md':'05842ddd66cbd1037a167144a2d7282138be2642'
          }
          for path, sha in expected.items():
              assert subprocess.check_output(['git','rev-parse',':'+path],text=True).strip() == sha, path
              assert subprocess.check_output(['git','hash-object',path],text=True).strip() == sha, path
          PY
          git rm -- .github/directory-cli-0.b64 .github/directory-cli-1.b64 .github/directory-cli-2.b64 .github/directory-cli-3.b64 .github/workflows/directory-cli-snapshot.yml .github/workflows/directory-cli-publish.yml
          test "$(git write-tree)" = d9a1e177e6bd973ee157f1fabdeae4dd1a04d6db
          git diff --check --cached
          git commit -m 'feat: expose authenticated directory enrollment in scan'
          test "$(git rev-parse HEAD^{tree})" = d9a1e177e6bd973ee157f1fabdeae4dd1a04d6db
          test "$(git rev-parse HEAD^2)" = afdc9fbd129c352f55e3f8f32e28d9e8ecaf453d
          git push origin HEAD:refs/heads/feat/directory-scan-cli
