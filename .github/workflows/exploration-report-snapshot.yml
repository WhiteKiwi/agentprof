name: Exploration report source snapshot
on:
  push:
    branches: [feat/exploration-unified-report]
    paths: [.github/workflows/exploration-report-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Export tracked source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git archive --format=tar.gz --output="$RUNNER_TEMP/report-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exploration-report-source
          path: ${{ runner.temp }}/report-source.tar.gz
          retention-days: 1
          if-no-files-found: error
