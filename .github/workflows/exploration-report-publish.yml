name: Publish qualified exploration report source
on:
  push:
    branches: [feat/exploration-unified-report]
    paths: [.github/workflows/exploration-report-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/feat/exploration-unified-report'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - name: Verify inert patch, allowed paths and exact tested blobs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          first = pathlib.Path('.github/exploration-report-0.b64').read_bytes()
          assert blob(first) == 'b3c3ffd605a5e1abd15fafdca55fae40f322b512', 'Unexpected staged first part'
          # Correct one independently identified staging transcription omission; require the exact original blob.
          assert first.count(b'OIOqFKhG') == 1
          first = first.replace(b'OIOqFKhG', b'OIOqFfKhG')
          assert blob(first) == '0c5579cf2c6c64cac6bece2c9e4e3385beacbf3d', 'First-part reconstruction mismatch'
          second = pathlib.Path('.github/exploration-report-1.b64').read_bytes()
          assert blob(second) == 'b9ad767e676bbf5c8cd1c94ec6df3ad4e449ebe9', 'Unexpected second part'
          patch = gzip.decompress(base64.b64decode(first.strip() + second.strip(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'fa41e145e94caece19c42721e94523dbe62ea96a8f3482ed24565a1044d1bf18', 'Patch digest mismatch'
          patch.decode('utf-8')
          allowed = {
              'docs/P6-EXPLORATION-REPORT-VERIFY.md': 'ec1c500b3f4b3111f59854f266750f54ff0e30a6',
              'src/report/exploration-section.ts': '3c38344e4203ea24e423cb2cd6a09ed6d18e42c8',
              'src/report/unified-model.ts': 'f36babf81d5c2ba693af8f85e374c9417406d9af',
              'src/report/unified-page.ts': '45802d3a9bb9f1dd118c5eabbf41c34c9e3882ad',
              'tests/exploration-report-cli.test.ts': 'd3247d1a52fa20aa61541bea6404fc059691ed67',
              'tests/exploration-report.test.ts': '29a1ac1822bbb9ba2814c8133eded856e54498c3',
          }
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'exploration-report.patch'
          target.write_bytes(patch)
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(target)], text=True).splitlines()
          assert sorted(line.split('\t')[2] for line in stats) == sorted(allowed), 'Patch outside allowed scope'
          subprocess.run(['git', 'apply', '--index', '--whitespace=error', str(target)], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert sorted(changed) == sorted(allowed), 'Unexpected staged files'
          for path, expected in allowed.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == expected, 'Tested blob mismatch: ' + path
          print('PASS: six tested product/test/document blobs match the local manifest')
          PY
          git rm .github/exploration-report-0.b64 .github/exploration-report-1.b64 .github/workflows/exploration-report-publish.yml .github/workflows/exploration-report-snapshot.yml
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/feat/exploration-unified-report | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'AgentProf development'
          git config user.email 'agentprof-dev@users.noreply.github.com'
          git commit -m 'feat: include native exploration evidence in unified reports'
          git push origin HEAD:refs/heads/feat/exploration-unified-report
