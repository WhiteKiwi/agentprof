name: Directory batch prerequisite snapshot
on:
  push:
    branches: [feat/directory-batch-enrollment]
    paths: [.github/workflows/directory-batch-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: aa60e9b2b6802a255983b5e8ac203c7de780a355
          persist-credentials: false
      - name: Archive fixed source only
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = aa60e9b2b6802a255983b5e8ac203c7de780a355
          git archive --format=tar.gz --output="$RUNNER_TEMP/batch-base.tgz" HEAD
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/tree.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: directory-batch-base
          path: |
            ${{ runner.temp }}/batch-base.tgz
            ${{ runner.temp }}/tree.txt
          retention-days: 1
          if-no-files-found: error
