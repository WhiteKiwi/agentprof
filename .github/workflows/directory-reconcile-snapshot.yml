name: Reconciliation prerequisite snapshot
on:
  push:
    branches: [feat/directory-missing-reconciliation]
    paths: [.github/workflows/directory-reconcile-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 4317381222c9c50bd22d904889bbc0f9f196f691
          persist-credentials: false
      - name: Archive tracked inputs
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 4317381222c9c50bd22d904889bbc0f9f196f691
          git archive --format=tar.gz --output="$RUNNER_TEMP/reconcile-base.tgz" HEAD
          git ls-tree -r HEAD > "$RUNNER_TEMP/reconcile-tree.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reconcile-base
          path: |
            ${{ runner.temp }}/reconcile-base.tgz
            ${{ runner.temp }}/reconcile-tree.txt
          retention-days: 1
          if-no-files-found: error
