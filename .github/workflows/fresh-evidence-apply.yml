name: Publish verified fresh evidence integration
on:
  push:
    branches: [feat/fresh-evidence-workflows]
    paths: [.github/workflows/fresh-evidence-apply.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/feat/fresh-evidence-workflows'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/fresh-evidence-workflows
          persist-credentials: true
      - name: Apply exact local candidate and verify source hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python .github/fresh-evidence-apply.py
          git diff --check
          git add src/cli/fresh-analysis.ts src/cli/history.ts src/cli/main.ts src/cli/patterns.ts src/cli/report-fresh.ts
          git rm .github/fresh-evidence-apply.py .github/workflows/fresh-evidence-apply.yml .github/workflows/fresh-evidence-snapshot.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: wire explicit evidence capture and fresh daily token reports'
          git push origin HEAD:refs/heads/feat/fresh-evidence-workflows
          git rev-parse HEAD
