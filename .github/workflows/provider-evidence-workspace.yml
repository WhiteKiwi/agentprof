name: Provider evidence workspace
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
jobs:
  workspace:
    if: github.head_ref == 'feat/provider-pattern-evidence' && github.event.pull_request.head.repo.full_name == 'WhiteKiwi/agentprof'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: d62bb48bcea4c6f9b9d503c0c2ac1e890da86afa
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
      - name: Archive fixed source and pinned development tooling only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d62bb48bcea4c6f9b9d503c0c2ac1e890da86afa
          mkdir -p "$RUNNER_TEMP/evidence-workspace"
          git archive --format=tar HEAD > "$RUNNER_TEMP/evidence-workspace/source.tar"
          npx --yes pnpm@10.34.6 install --frozen-lockfile --ignore-scripts
          tar -czf "$RUNNER_TEMP/evidence-workspace/dependencies.tgz" node_modules
          cp "$(command -v node)" "$RUNNER_TEMP/evidence-workspace/node"
          sha256sum "$RUNNER_TEMP/evidence-workspace/source.tar" "$RUNNER_TEMP/evidence-workspace/dependencies.tgz" "$RUNNER_TEMP/evidence-workspace/node"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-evidence-workspace
          path: ${{ runner.temp }}/evidence-workspace/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
