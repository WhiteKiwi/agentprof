name: Apply verified usage timing source
on:
  push:
    branches: [feat/usage-time-history]
    paths: [.github/workflows/apply-usage-time.yml]
permissions:
  contents: write
concurrency:
  group: publish-usage-time-history
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'WhiteKiwi/agentprof' && github.ref == 'refs/heads/feat/usage-time-history'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply only hash-verified reviewed edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 5cb65a215fc101f721c22c9ddbeb4c278106151f HEAD
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          raw = pathlib.Path('.ci/usage-time-edits.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '1b7fca6fbbffc39d23cbae43a91de1a675610802b564c2fb5cb0a644d9995e95'
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          allowed = set('''src/analysis/source-failures.ts
          src/analysis/source-recovery.ts
          src/analysis/source-search-recurrence.ts
          src/analysis/source-slow-tool.ts
          src/cli/history.ts
          src/cli/main.ts
          src/cli/scan.ts
          src/db/source-checkpoint-validation.ts
          src/db/source-metric-validation.ts
          src/parsers/claude/checkpoint.ts
          src/parsers/claude/index.ts
          src/parsers/claude/types.ts
          src/parsers/codex/checkpoint.ts
          src/parsers/codex/index.ts
          src/parsers/types.ts
          src/scanner/scan-run.ts
          src/scanner/source-ingest.ts
          tests/claude-search-storage.test.ts'''.splitlines())
          doc = json.loads(raw)
          assert doc['format'] == 1 and len(doc['files']) == 18
          assert {f['path'] for f in doc['files']} == allowed
          pending = []
          for f in doc['files']:
              path = pathlib.Path(f['path'])
              assert path.is_file() and not path.is_symlink()
              original = path.read_bytes()
              assert blob(original) == f['old'], f['path'] + ': old hash'
              text = original.decode('utf8')
              prior = 0
              for start, end, replacement in f['edits']:
                  assert type(start) is int and type(end) is int and isinstance(replacement, str)
                  assert 0 <= prior <= start <= end <= len(text)
                  prior = end
              for start, end, replacement in reversed(f['edits']):
                  text = text[:start] + replacement + text[end:]
              data = text.encode('utf8')
              assert blob(data) == f['new'], f['path'] + ': new hash'
              pending.append((path, data))
          for path, data in pending:
              path.write_bytes(data)
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          print('Verified and applied 18 existing-file deltas.')
          PY
          git rm -- .ci/usage-time-edits.json .github/workflows/apply-usage-time.yml
          test "$(git write-tree)" = 4af9bd27a602832278bc366b31beb96705972a9e
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: capture usage timestamps and report daily token evidence'
          test "$(git rev-parse 'HEAD^{tree}')" = 4af9bd27a602832278bc366b31beb96705972a9e
          test "$(git ls-remote origin refs/heads/feat/usage-time-history | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/feat/usage-time-history
          printf 'Published source commit: '; git rev-parse HEAD
          printf 'Verified source tree: '; git rev-parse 'HEAD^{tree}'
