name: Directory CLI source snapshot
on:
  push:
    branches: [feat/directory-scan-cli]
    paths: [.github/workflows/directory-cli-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: d14cce6647ebb8456af6f768405ad5d211e37074
          persist-credentials: false
      - name: Archive immutable tracked inputs only
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = d14cce6647ebb8456af6f768405ad5d211e37074
          git archive --format=tar.gz --output="$RUNNER_TEMP/directory-base.tgz" HEAD
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 5614a3107b53022f29ea32d44ba83f533fd58b92
          path: old-schema
          persist-credentials: false
      - name: Archive historical schema seed
        run: git -C old-schema archive --format=tar.gz --output="$RUNNER_TEMP/schema5.tgz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: directory-cli-sources
          path: |
            ${{ runner.temp }}/directory-base.tgz
            ${{ runner.temp }}/schema5.tgz
          retention-days: 1
          if-no-files-found: error
