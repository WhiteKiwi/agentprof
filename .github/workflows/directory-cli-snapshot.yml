name: Directory CLI source snapshot
on:
  push:
    branches: [feat/directory-scan-cli]
    paths: [.github/workflows/directory-cli-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: afdc9fbd129c352f55e3f8f32e28d9e8ecaf453d
          persist-credentials: false
      - name: Archive immutable tracked inputs only
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = afdc9fbd129c352f55e3f8f32e28d9e8ecaf453d
          git archive --format=tar.gz --output="$RUNNER_TEMP/directory-current.tgz" HEAD
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/tree.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: directory-cli-current-sources
          path: |
            ${{ runner.temp }}/directory-current.tgz
            ${{ runner.temp }}/tree.txt
          retention-days: 1
          if-no-files-found: error
