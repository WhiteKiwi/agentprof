name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ["24.15.0", "24.21.0", "26.7.0"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check

  unsupported-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.16.0"
      - name: Reject before CLI or SQLite imports
        run: |
          mkdir -p dist
          cp bin/agentprof.cjs dist/agentprof.cjs
          node -e 'const p=require("node:child_process").spawnSync(process.execPath,["dist/agentprof.cjs","--json"],{encoding:"utf8"});const e=JSON.parse(p.stderr);if(p.status!==2||e.error.code!=="UNSUPPORTED_RUNTIME"||p.stdout)process.exit(1)'
