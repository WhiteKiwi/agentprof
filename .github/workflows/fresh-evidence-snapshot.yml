name: Fresh evidence development snapshot
on:
  push:
    branches: [feat/fresh-evidence-workflows]
    paths: [.github/workflows/fresh-evidence-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          mise_toml: |
            [tools]
            node = "24.21.0"
            pnpm = "10.34.6"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 5614a3107b53022f29ea32d44ba83f533fd58b92
          path: .ci/pre-resume
          persist-credentials: false
      - name: Package resolved runtime and immutable historical seed only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .ci/pre-resume rev-parse HEAD)" = 5614a3107b53022f29ea32d44ba83f533fd58b92
          npm --prefix .ci/pre-resume ci --ignore-scripts --no-audit --no-fund
          npm --prefix .ci/pre-resume run build
          out="$RUNNER_TEMP/fresh-toolchain"
          mkdir -p "$out/runtime" "$out/legacy"
          prefix="$(dirname "$(dirname "$(node -p 'process.execPath')")")"
          cp -a "$prefix/bin" "$prefix/lib" "$out/runtime/"
          cp -a .ci/pre-resume/dist "$out/legacy/"
          "$out/runtime/bin/node" -p 'JSON.stringify(process.versions)' > "$out/NODE_VERSIONS.json"
          test "$("$out/runtime/bin/node" -p 'process.versions.node')" = 24.21.0
          printf '%s\n' 5614a3107b53022f29ea32d44ba83f533fd58b92 > "$out/LEGACY_COMMIT"
          tar -czf "$RUNNER_TEMP/fresh-toolchain.tgz" -C "$out" runtime legacy NODE_VERSIONS.json LEGACY_COMMIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh-evidence-toolchain
          path: ${{ runner.temp }}/fresh-toolchain.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
