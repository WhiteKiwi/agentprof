name: Root rebind prerequisite snapshot
on:
  push:
    branches: [feat/directory-root-rebind]
    paths: [.github/workflows/root-rebind-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 617e32a13ea3be5b9038acb7b4330131f2c93567
          persist-credentials: false
      - run: |
          set -eu
          test "$(git rev-parse HEAD)" = 617e32a13ea3be5b9038acb7b4330131f2c93567
          git archive --format=tar.gz --output="$RUNNER_TEMP/rebind-base.tgz" HEAD
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/rebind-tree.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rebind-base
          path: |
            ${{ runner.temp }}/rebind-base.tgz
            ${{ runner.temp }}/rebind-tree.txt
          retention-days: 1
          if-no-files-found: error
