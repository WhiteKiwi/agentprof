name: Publish verified directory batch tree
on:
  push:
    branches: [feat/directory-batch-enrollment]
    paths: [.github/workflows/directory-batch-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Verify and apply frozen patch to exact prerequisite
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/feat/directory-batch-enrollment
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib
          expected = [
              'a2c76e7b64087f3bfa4d533d53c9c460286899d4ac40e43198ba297bfdb04a6c',
              '63d8216498badd14ed2d161d149076434d22d7a3fc6122654dce86ea1d25192c',
              '68fc13d88419b7db8237d6b85cf2aa76ca86544bcf79533ef94845890e632fb4',
              '381d18a0d3e7ee4411462a30027a230ccd879f9f8d8c869d657efea94ee7feda',
          ]
          pieces = []
          for i, digest in enumerate(expected):
              data = pathlib.Path(f'.github/directory-batch-payload-{i}.b64').read_bytes()
              assert hashlib.sha256(data).hexdigest() == digest, f'segment {i} mismatch'
              pieces.append(data.strip())
          patch = gzip.decompress(base64.b64decode(b''.join(pieces), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '89058668d094378b7d5938e2953396e98fe7e7f8a05f6302a04d154bc628cea2'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'directory-batch.patch').write_bytes(patch)
          PY
          git fetch --no-tags --depth=1 origin aa60e9b2b6802a255983b5e8ac203c7de780a355
          test "$(git rev-parse 'aa60e9b2b6802a255983b5e8ac203c7de780a355^{tree}')" = eb296bb978273881e870a15c53eea5da29506187
          git read-tree --reset -u aa60e9b2b6802a255983b5e8ac203c7de780a355
          git apply --index --check "$RUNNER_TEMP/directory-batch.patch"
          git apply --index "$RUNNER_TEMP/directory-batch.patch"
          git diff --cached --check
          test "$(git write-tree)" = 80690b38d729e8bf2afc3b8ad8dbc8add73060e9
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: enroll large directories in bounded native scanner pages'
          test "$(git rev-parse 'HEAD^{tree}')" = 80690b38d729e8bf2afc3b8ad8dbc8add73060e9
          git push origin HEAD:refs/heads/feat/directory-batch-enrollment
          git log -1 --format='%H %T'
